name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -L --fail --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import
        run: godot --headless --path . --import || godot --headless --path . --import
      - name: Acceptance tests
        run: godot --headless --path . res://tests/doors_test.tscn
      - name: Demo smoke run
        run: godot --headless --path . res://demo/main.tscn -- --smoke
